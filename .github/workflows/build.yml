name: build

# Builds the archives on every pull request and push to main. A release is
# published by pushing a tag occt-<version>-<config hash>, or by running this
# workflow on main with "release" ticked; see README.md.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["occt-*"]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release of the current configuration (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive:
    name: archive (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: |
          if ! command -v ninja >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then
              brew install ninja
            else
              sudo apt-get update && sudo apt-get install -y ninja-build
            fi
          fi

      - name: Name the archive
        id: name
        run: echo "name=occt-$(./build.sh --config | sed -n 's/^occt.version=//p')-$(./build.sh --config-hash)-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build.sh --prefix "$RUNNER_TEMP/${{ steps.name.outputs.name }}" --work-dir "$RUNNER_TEMP/work"

      - name: Pack
        env:
          COPYFILE_DISABLE: 1 # no AppleDouble files from macOS tar
        run: |
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/${{ steps.name.outputs.name }}.tar.gz" "${{ steps.name.outputs.name }}"
          cat "$RUNNER_TEMP/${{ steps.name.outputs.name }}/manifest.json"
          ls -l dist

      - name: Check the archive
        run: python3 ci/check-archive.py "dist/${{ steps.name.outputs.name }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Collect the source offer
        run: |
          version=$(./build.sh --config | sed -n 's/^occt.version=//p')
          mkdir -p dist
          ./build.sh --source-archive "dist/occt-$version-source.tar.gz"
          tar -xzf "dist/occt-$version-source.tar.gz" -C dist --strip-components=1 \
            "occt-$version/LICENSE_LGPL_21.txt" "occt-$version/OCCT_LGPL_EXCEPTION.txt"
          cp build.sh dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/
          if-no-files-found: error

  release:
    needs: [archive, source]
    if: >-
      startsWith(github.ref, 'refs/tags/occt-') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(./build.sh --config | sed -n 's/^occt.version=//p')
          commit=$(./build.sh --config | sed -n 's/^occt.commit=//p')
          hash=$(./build.sh --config-hash)
          tag="occt-$version-$hash"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match this configuration; tag it $tag"
            exit 1
          fi

          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          {
            echo "OCCT $version (commit \`$commit\`), config hash \`$hash\`, built from $GITHUB_SHA."
            echo
            echo "| Target | Archive | SHA-256 |"
            echo "|---|---|---|"
            for archive in occt-"$version-$hash"-*.tar.gz; do
              target=${archive#occt-"$version-$hash"-}
              target=${target%.tar.gz}
              echo "| \`$target\` | [$archive]($base/$archive) | \`$(sha256sum "$archive" | cut -d' ' -f1)\` |"
            done
            echo
            echo "The OCCT source (\`occt-$version-source.tar.gz\`), the build script (\`build.sh\`), and the LGPL 2.1 and OCCT exception texts are attached as OCCT's LGPL source offer. \`SHA256SUMS\` covers every asset."
          } > ../notes.md
          cat ../notes.md

          gh release create "$tag" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OCCT $version ($hash)" \
            --notes-file ../notes.md
